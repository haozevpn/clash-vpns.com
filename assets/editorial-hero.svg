<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">机场测评复古报刊插画</title>
  <desc id="desc">米白色纸张上的复古报刊、胶片相机和网络节点插画</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5b654e" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#e8dcc7"/>
  <rect x="24" y="24" width="912" height="572" fill="#f5eddf" stroke="#9c8d76" stroke-width="3" filter="url(#paper)"/>
  <rect x="54" y="54" width="852" height="512" fill="none" stroke="#b6a58c" stroke-width="1"/>
  <path d="M78 112H882M78 454H882" stroke="#9c8d76" stroke-width="2"/>
  <text x="82" y="92" fill="#59644d" font-size="20" font-family="Georgia,serif" letter-spacing="5">THE WEEKLY ROUTE</text>
  <text x="82" y="180" fill="#2e2a24" font-size="64" font-family="Georgia,'Times New Roman',serif" font-weight="700">机场测评</text>
  <text x="86" y="214" fill="#a45c45" font-size="17" font-family="Georgia,serif" letter-spacing="4">速度 · 稳定 · 解锁</text>
  <g fill="#59644d" opacity=".78">
    <rect x="84" y="250" width="232" height="12"/>
    <rect x="84" y="275" width="196" height="8"/>
    <rect x="84" y="295" width="222" height="8"/>
    <rect x="84" y="315" width="178" height="8"/>
    <rect x="84" y="335" width="215" height="8"/>
  </g>
  <g fill="none" stroke="#59644d" stroke-width="4" opacity=".9">
    <path d="M390 390C430 315 480 305 525 348S612 414 670 300"/>
    <path d="M430 414C484 368 522 375 558 407S625 461 718 378" stroke="#a45c45"/>
  </g>
  <g fill="#a45c45" stroke="#f5eddf" stroke-width="4">
    <circle cx="390" cy="390" r="11"/>
    <circle cx="525" cy="348" r="11"/>
    <circle cx="670" cy="300" r="11"/>
    <circle cx="430" cy="414" r="11"/>
    <circle cx="558" cy="407" r="11"/>
    <circle cx="718" cy="378" r="11"/>
  </g>
  <g transform="translate(612 116) rotate(8)">
    <rect x="0" y="0" width="190" height="128" rx="4" fill="#59644d"/>
    <rect x="14" y="14" width="162" height="100" fill="#d5c6ad"/>
    <circle cx="95" cy="64" r="38" fill="#2e2a24"/>
    <circle cx="95" cy="64" r="25" fill="#a45c45"/>
    <circle cx="95" cy="64" r="12" fill="#e8dcc7"/>
    <rect x="28" y="-18" width="48" height="24" fill="#59644d"/>
  </g>
  <rect x="730" y="470" width="128" height="58" fill="url(#dots)"/>
  <text x="748" y="506" fill="#59644d" font-size="15" font-family="Georgia,serif" letter-spacing="3">NO. 09</text>
  <text x="84" y="512" fill="#2e2a24" font-size="18" font-family="Georgia,serif">从真实测试，读懂每一条线路</text>
</svg>
