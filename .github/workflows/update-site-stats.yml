name: Update site statistics

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh site statistics
        run: node scripts/update-site-stats.mjs

      - name: Commit refreshed statistics
        run: |
          if git diff --quiet -- index.html; then
            echo "No statistics changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh site statistics"
          git push
